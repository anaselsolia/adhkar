<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5E50">
<meta name="description" content="أذكار الصباح والمساء والنوم وبعد الصلاة والرقية الشرعية، مع عدّاد لكل ذكر.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ورد الأذكار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one narrow reading column, sticky section switcher, each dhikr a card with its own counter */
:root{
  --bg:#EDF1EE; --surface:#FBFCFB; --ink:#15302A; --muted:#5B6F69; --line:#D3DDD8;
  --pine:#1D5E50; --pine-soft:#DCEAE5; --brass:#9C6F22; --done:#E3ECE8;
  --f-text:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
  --size:1.5rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --surface:#152321; --ink:#E4EEEA; --muted:#93A8A1; --line:#24372F;
  --pine:#6FC0A9; --pine-soft:#1C332D; --brass:#D9AE62; --done:#111D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#152321; --ink:#E4EEEA; --muted:#93A8A1; --line:#24372F;
  --pine:#6FC0A9; --pine-soft:#1C332D; --brass:#D9AE62; --done:#111D1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;margin:0;color:var(--pine);letter-spacing:0}
.tools{display:flex;gap:6px}
.tools button{font:500 .9rem var(--f-ui);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:40px;height:38px;cursor:pointer;padding:0 10px}
.tools button:hover{border-color:var(--pine)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:14px;padding-block:10px;border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:500 .95rem var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pine);border-color:var(--pine);color:var(--surface)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.sec-head h2{font-family:var(--f-display);font-weight:500;font-size:1.45rem;margin:0}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.stat{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.reset{font:500 .85rem var(--f-ui);background:none;border:none;color:var(--pine);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;transition:background .3s,opacity .3s}
.card.done{background:var(--done);opacity:.62}
.card h3{margin:0 0 8px;font:600 .85rem var(--f-ui);color:var(--brass);letter-spacing:.02em}
.txt{font-family:var(--f-text);font-size:var(--size);line-height:2.05;margin:0;white-space:pre-line;cursor:pointer;-webkit-tap-highlight-color:transparent}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.meta{min-width:0;font-size:.85rem;color:var(--muted)}
.meta details summary{cursor:pointer;color:var(--pine);font-weight:500;list-style:none}
.meta details summary::-webkit-details-marker{display:none}
.meta details p{margin:6px 0 0;color:var(--ink);font-size:.9rem}
.count{flex:0 0 auto;position:relative;width:62px;height:62px;border-radius:50%;border:none;background:var(--pine-soft);color:var(--pine);cursor:pointer;font:600 1.15rem var(--f-ui);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.count svg{position:absolute;inset:0;transform:rotate(-90deg)}
.count circle{fill:none;stroke-width:4}
.count .trk{stroke:var(--line)}
.count .prg{stroke:var(--pine);stroke-linecap:round;transition:stroke-dashoffset .25s}
.count span{position:relative;line-height:1}
.count small{display:block;font-size:.62rem;font-weight:500;color:var(--muted);margin-top:2px}
.card.done .count{background:var(--pine);color:var(--surface)}
.count:active{transform:scale(.95)}
button:focus-visible,.tab:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.finish{text-align:center;padding:26px 16px;color:var(--pine);font-family:var(--f-text);font-size:1.3rem}
.note{color:var(--muted);font-size:.82rem;margin-top:26px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>ورد الأذكار</h1>
    <div class="tools" aria-label="حجم الخط">
      <button id="fs-down" type="button" aria-label="تصغير الخط">أ−</button>
      <button id="fs-up" type="button" aria-label="تكبير الخط">أ+</button>
    </div>
  </header>

  <nav class="tabs">
    <div class="tablist" role="tablist" id="tabs"></div>
    <div class="bar"><i id="bar"></i></div>
  </nav>

  <section>
    <div class="sec-head">
      <div><h2 id="sec-title"></h2><p id="sec-hint"></p></div>
      <div style="text-align:left"><div class="stat" id="stat"></div><button class="reset" id="reset" type="button">ابدأ من جديد</button></div>
    </div>
    <div class="list" id="list"></div>
    <div class="finish" id="finish" hidden>تقبّل الله منك، أتممت الورد ✓</div>
  </section>
  <p class="note">اضغط على النص أو على العدّاد لتسجيل كل مرة. يُحفظ تقدّمك على هذا الجهاز، وتبدأ أذكار الصباح والمساء والنوم من جديد كل يوم.</p>
</div>

<script>
const AYAT_KURSI="أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ\nﷲ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ".replace("ﷲ","اللَّهُ");
const BISM="بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\n";
const IKHLAS=BISM+"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ";
const FALAQ=BISM+"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ";
const NAS=BISM+"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ";
const BAQARA_END="آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ";
const TAHLIL="لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ";

function dayAdhkar(m){
  const A=m?"أَصْبَحْنَا":"أَمْسَيْنَا", A2=m?"أَصْبَحَ":"أَمْسَى", Ait=m?"أَصْبَحْتُ":"أَمْسَيْتُ";
  const today=m?"هَٰذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ"
               :"هَٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا";
  const L=[
    {h:"آية الكرسي",x:AYAT_KURSI,n:1,s:"البقرة ٢٥٥ — رواه الحاكم والنسائي",f:"من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير منهم حتى يصبح."},
    {h:"سورة الإخلاص",x:IKHLAS,n:3,s:"رواه أبو داود والترمذي",f:"من قرأ المعوذات ثلاثًا حين يمسي وحين يصبح كفته من كل شيء."},
    {h:"سورة الفلق",x:FALAQ,n:3,s:"رواه أبو داود والترمذي"},
    {h:"سورة الناس",x:NAS,n:3,s:"رواه أبو داود والترمذي"},
    {x:`${A} وَ${A2} الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي ${today}، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ`,n:1,s:"رواه مسلم"},
    {x:m?"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",n:1,s:"رواه الترمذي"},
    {h:"سيد الاستغفار",x:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",n:1,s:"رواه البخاري",f:"من قالها موقنًا بها حين يمسي فمات من ليلته دخل الجنة، وكذلك إذا أصبح."},
    {x:`اللَّهُمَّ إِنِّي ${Ait} أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ`,n:4,s:"رواه أبو داود",f:"من قالها أربعًا أعتقه الله من النار."},
    {x:`اللَّهُمَّ مَا ${A2} بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ`,n:1,s:"رواه أبو داود",f:`من قالها حين ${m?"يصبح فقد أدّى شكر يومه":"يمسي فقد أدّى شكر ليلته"}.`},
    {x:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَٰهَ إِلَّا أَنْتَ",n:3,s:"رواه أبو داود"},
    {x:"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",n:7,s:"رواه أبو داود",f:"من قالها سبعًا كفاه الله ما أهمّه من أمر الدنيا والآخرة."},
    {x:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",n:1,s:"رواه أبو داود وابن ماجه"},

const ar=n=>n.toLocaleString("ar-EG");
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let progress=store.get("adhkar.progress.v2",{});
let fs=store.get("adhkar.fs",1.5);
let cur;

function secState(sec){
  let p=progress[sec.id];
  if(!p||(sec.daily&&p.day!==todayKey())){p={day:todayKey(),c:{}};progress[sec.id]=p}
  return p;
}
function save(){store.set("adhkar.progress.v2",progress)}

function defaultSection(){
  const h=new Date().getHours();
  if(h>=3&&h<12) return "morning";
  if(h>=15&&h<21) return "evening";
  if(h>=21||h<3) return "sleep";
  return "prayer";
}

const tabsEl=document.getElementById("tabs");
SECTIONS.forEach(s=>{
  const b=document.createElement("button");
  b.className="tab";b.type="button";b.role="tab";b.id="tab-"+s.id;b.textContent=s.short;
  b.onclick=()=>{location.hash=s.id};
  tabsEl.appendChild(b);
});

const R=27,C=2*Math.PI*R;
function render(){
  const id=(location.hash||"").slice(1);
  cur=SECTIONS.find(s=>s.id===id)||SECTIONS.find(s=>s.id===defaultSection());
  SECTIONS.forEach(s=>document.getElementById("tab-"+s.id).setAttribute("aria-selected",s===cur));
  document.getElementById("sec-title").textContent=cur.name;
  document.getElementById("sec-hint").textContent=cur.hint;
  const st=secState(cur);
  const list=document.getElementById("list");list.innerHTML="";
  cur.items.forEach((it,i)=>{
    const card=document.createElement("article");card.className="card";card.dataset.i=i;
    card.innerHTML=`${it.h?`<h3>${it.h}</h3>`:""}<p class="txt"></p>
      <div class="foot"><div class="meta">${it.s?`<div>${it.s}</div>`:""}${it.f?`<details><summary>الفضل</summary><p>${it.f}</p></details>`:""}</div>
      <button class="count" type="button" aria-label="سجّل مرة"><svg viewBox="0 0 62 62"><circle class="trk" cx="31" cy="31" r="${R}"/><circle class="prg" cx="31" cy="31" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span></span></button></div>`;
    card.querySelector(".txt").textContent=it.x;
    card.querySelector(".txt").onclick=()=>tap(i);
    card.querySelector(".count").onclick=()=>tap(i);
    list.appendChild(card);
    paint(i);
  });
  summary();
}
function paint(i){
  const it=cur.items[i],c=secState(cur).c[i]||0;
  const card=document.querySelector(`.card[data-i="${i}"]`);if(!card)return;
  const left=it.n-c,done=left<=0;
  card.classList.toggle("done",done);
  card.querySelector(".prg").setAttribute("stroke-dashoffset",C*(1-Math.min(c/it.n,1)));
  card.querySelector(".count span").innerHTML=done?"✓":`${ar(left)}${it.n>1?`<small>من ${ar(it.n)}</small>`:""}`;
}
function summary(){
  const st=secState(cur);let total=0,got=0,doneN=0;
  cur.items.forEach((it,i)=>{const c=Math.min(st.c[i]||0,it.n);total+=it.n;got+=c;if(c>=it.n)doneN++});
  document.getElementById("bar").style.width=(got/total*100)+"%";
  document.getElementById("stat").textContent=`${ar(doneN)} من ${ar(cur.items.length)} ذكر`;
  document.getElementById("finish").hidden=doneN<cur.items.length;
}
function tap(i){
  const st=secState(cur),it=cur.items[i],c=st.c[i]||0;
  if(c>=it.n)return;
  st.c[i]=c+1;save();paint(i);summary();
  try{navigator.vibrate&&navigator.vibrate(c+1>=it.n?[30,40,30]:12)}catch(e){}
}
document.getElementById("reset").onclick=()=>{progress[cur.id]={day:todayKey(),c:{}};save();render();window.scrollTo({top:0,behavior:"smooth"})};
function applyFs(){document.documentElement.style.setProperty("--size",fs+"rem");store.set("adhkar.fs",fs)}
document.getElementById("fs-up").onclick=()=>{fs=Math.min(2.4,+(fs+0.15).toFixed(2));applyFs()};
document.getElementById("fs-down").onclick=()=>{fs=Math.max(1.05,+(fs-0.15).toFixed(2));applyFs()};
window.addEventListener("hashchange",()=>{render();window.scrollTo({top:0})});
applyFs();render();
</script>
